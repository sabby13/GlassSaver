<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precision Clock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0b0f12;
    cursor: none;
  }

  #scene {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform;
  }

  #rings-container {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    will-change: transform;
  }

  .ring-svg {
    position: absolute;
    will-change: transform;
  }

  #clock-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    will-change: transform;
  }

  #clock-display {
    font-family: "HK Modular", "Share Tech Mono", "Courier New", monospace;
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #e8e8e8;
    user-select: none;
    line-height: 1;
    will-change: opacity;
    position: relative;
    z-index: 2;
  }

  #hand-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 3;
  }
</style>
</head>
<body>

<div id="scene">
  <div id="rings-container">
    <svg id="ring-outer" class="ring-svg"></svg>
    <svg id="ring-middle" class="ring-svg"></svg>
    <svg id="ring-inner" class="ring-svg"></svg>
  </div>

  <div id="clock-wrapper">
    <canvas id="hand-canvas"></canvas>
    <div id="clock-display">00:00:00:00</div>
  </div>
</div>

<script>
(function() {
  const scene = document.getElementById('scene');
  const clockDisplay = document.getElementById('clock-display');
  const handCanvas = document.getElementById('hand-canvas');
  const ctx = handCanvas.getContext('2d');

  const svgOuter = document.getElementById('ring-outer');
  const svgMiddle = document.getElementById('ring-middle');
  const svgInner = document.getElementById('ring-inner');

  let W = 0, H = 0;
  let cx = 0, cy = 0;

  let mouseX = 0, mouseY = 0;
  let smoothMouseX = 0, smoothMouseY = 0;

  let ringAngles = [0, 0, 0];
  const ringSpeeds = [0.00018, 0.00025, 0.00013];
  const ringDirs = [-1, 1, -1];

  let flickerOpacity = 1;
  let flickerTarget = 1;
  let flickerTimer = 0;

  let lastTime = performance.now();
  let rafId;

  function buildRing(svg, cx, cy, radius, dotSize, dotCount) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    for (let i = 0; i < dotCount; i++) {
      const angle = (i / dotCount) * Math.PI * 2;
      const x = cx + radius * Math.cos(angle);
      const y = cy + radius * Math.sin(angle);
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      const half = dotSize / 2;
      rect.setAttribute('x', x - half);
      rect.setAttribute('y', y - half);
      rect.setAttribute('width', dotSize);
      rect.setAttribute('height', dotSize);
      rect.setAttribute('fill', 'rgba(255,255,255,0.88)');
      svg.appendChild(rect);
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    cx = W / 2;
    cy = H / 2;

    const minDim = Math.min(W, H);
    const r1 = minDim * 0.38;
    const r2 = minDim * 0.46;
    const r3 = minDim * 0.56;

    buildRing(svgInner,  cx, cy, r1, minDim * 0.012, 72);
    buildRing(svgMiddle, cx, cy, r2, minDim * 0.011, 90);
    buildRing(svgOuter,  cx, cy, r3, minDim * 0.010, 108);

    const handSize = minDim * 0.42;
    handCanvas.width  = handSize * 2;
    handCanvas.height = handSize * 2;
    handCanvas.style.width  = handSize * 2 + 'px';
    handCanvas.style.height = handSize * 2 + 'px';
  }

  function drawHand(seconds) {
    const size = handCanvas.width / 2;
    ctx.clearRect(0, 0, handCanvas.width, handCanvas.height);

    const angle = (seconds / 60) * Math.PI * 2 - Math.PI / 2;
    const handLength = size * 0.72;
    const pivotRadius = size * 0.028;

    const ex = size + Math.cos(angle) * handLength;
    const ey = size + Math.sin(angle) * handLength;

    ctx.beginPath();
    ctx.moveTo(size, size);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = '#e63232';
    ctx.lineWidth = Math.max(1.5, size * 0.018);
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(size, size, pivotRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#e63232';
    ctx.fill();
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function updateClock() {
    const now = new Date();
    const h  = pad2(now.getHours());
    const m  = pad2(now.getMinutes());
    const s  = pad2(now.getSeconds());
    const ms = pad2(Math.floor(now.getMilliseconds() / 10));
    clockDisplay.textContent = `${h}:${m}:${s}:${ms}`;

    const continuousSeconds = now.getSeconds() + now.getMilliseconds() / 1000;
    drawHand(continuousSeconds);
  }

  function updateFlicker(dt) {
    flickerTimer -= dt;
    if (flickerTimer <= 0) {
      const r = Math.random();
      if (r < 0.04) {
        flickerTarget = 0.82 + Math.random() * 0.08;
        flickerTimer = 40 + Math.random() * 60;
      } else if (r < 0.06) {
        flickerTarget = 0.94 + Math.random() * 0.04;
        flickerTimer = 80 + Math.random() * 120;
      } else {
        flickerTarget = 0.97 + Math.random() * 0.03;
        flickerTimer = 200 + Math.random() * 400;
      }
    }
    flickerOpacity += (flickerTarget - flickerOpacity) * 0.12;
    clockDisplay.style.opacity = flickerOpacity;
  }

  function updateParallax() {
    const lerpFactor = 0.05;
    smoothMouseX += (mouseX - smoothMouseX) * lerpFactor;
    smoothMouseY += (mouseY - smoothMouseY) * lerpFactor;

    const maxShift = 8;
    const dx = ((smoothMouseX / W) - 0.5) * maxShift;
    const dy = ((smoothMouseY / H) - 0.5) * maxShift;

    scene.style.transform = `translate(${dx * 0.5}px, ${dy * 0.5}px)`;
  }

  function updateRings(now) {
    const elapsed = now;

    const a0 = (elapsed * ringSpeeds[0] * ringDirs[0]) * Math.PI * 2;
    const a1 = (elapsed * ringSpeeds[1] * ringDirs[1]) * Math.PI * 2;
    const a2 = (elapsed * ringSpeeds[2] * ringDirs[2]) * Math.PI * 2;

    svgInner.style.transform  = `rotate(${a0}rad)`;
    svgMiddle.style.transform = `rotate(${a1}rad)`;
    svgOuter.style.transform  = `rotate(${a2}rad)`;

    svgInner.style.transformOrigin  = `${cx}px ${cy}px`;
    svgMiddle.style.transformOrigin = `${cx}px ${cy}px`;
    svgOuter.style.transformOrigin  = `${cx}px ${cy}px`;
  }

  function loop(now) {
    const dt = now - lastTime;
    lastTime = now;

    updateClock();
    updateFlicker(dt);
    updateParallax();
    updateRings(now);

    rafId = requestAnimationFrame(loop);
  }

  window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  window.addEventListener('resize', () => {
    resize();
  });

  resize();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
